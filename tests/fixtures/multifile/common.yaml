openapi: 3.0.1
info:
  title: Common
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    authToken:
      type: apiKey
      in: header
      name: X-API-Auth-Token
  parameters:
    start:
      name: start
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false
    BooleanAsInteger:
      type: integer
      enum: [0, 1]
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
