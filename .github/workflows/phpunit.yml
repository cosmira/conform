name: Tests

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']
        dependencies: [latest]
        include:
          - os: ubuntu-24.04
            php: '8.2'
            dependencies: lowest
          - os: windows-latest
            php: '8.5'
            dependencies: latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install matrix dependencies
        shell: bash
        env:
          PHP_VERSION: ${{ matrix.php }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          options=()
          if [[ "$DEPENDENCIES" == "lowest" ]]; then
            options+=(--prefer-lowest --prefer-stable)
          elif [[ "$PHP_VERSION" == "8.6" ]]; then
            options+=(--with 'illuminate/support:^13' --with 'symfony/yaml:^8'
                      --with 'symfony/finder:^8' --with 'symfony/http-foundation:^8'
                      --with 'phpunit/phpunit:^13' --with 'infection/infection:^0.35')
          fi
          composer update --prefer-dist --no-interaction --no-progress "${options[@]}"
          composer show --direct
      - name: Run PHPUnit
        shell: bash
        run: |
          mkdir -p build
          composer test -- --no-coverage --order-by=random --random-order-seed=1788957854 --display-warnings --fail-on-warning --log-junit build/phpunit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: build/phpunit.xml
          if-no-files-found: warn
