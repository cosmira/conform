name: ShellCheck

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell steps
        uses: docker://rhysd/actionlint:1.7.12
      - name: Check tracked shell scripts
        run: git ls-files -z -- '*.sh' | xargs -0 -r shellcheck
