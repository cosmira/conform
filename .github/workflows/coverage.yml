name: Code Coverage

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, xml, xmlwriter
          coverage: pcov
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Generate coverage reports
        run: |
          mkdir -p build
          composer test:coverage -- --coverage-clover=build/coverage.xml --coverage-html=build/coverage-html --colors=never
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            build/coverage.xml
            build/coverage-html
          if-no-files-found: warn
